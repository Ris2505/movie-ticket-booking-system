spring:
  application:
    name: movie-ticket-booking-system

  datasource:
    url: jdbc:postgresql://localhost:5432/moviebooking
    username: moviebooking
    password: moviebooking
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  hold-duration-minutes: 5
  hold-expiry-cron: "*/30 * * * * *"
  reminder-cron: "0 0 * * * *"
  reminder-hours-before-show: 2
  timezone: Asia/Kolkata

logging:
  level:
    com.moviebooking: INFO
